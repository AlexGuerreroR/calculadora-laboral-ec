# Integración continua · Calculadora Laboral EC (plan de calidad, taller de la clase 4)
# Corre todas las pruebas en cada pull request y en cada push a main. Si una prueba falla,
# GitHub marca el PR en rojo y no se debería fusionar.
# No usa claves: las pruebas reemplazan al modelo por un doble y no llaman a Gemini ni a Groq.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # torch solo para CPU: la versión con CUDA pesa varios GB y las pruebas no la usan
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install "pytest-cov>=6,<8"

      - name: Pruebas y cobertura
        run: pytest -q --cov=app --cov-report=term-missing
