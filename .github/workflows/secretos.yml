# Busca secretos (claves de API, contraseñas, tokens) en TODO el historial de TODAS las
# ramas, en cada push y pull request. Es el mismo comando que se corre en local.
# Taller de credenciales, semana 4 (UNIANDES).
name: secretos
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # descarga el historial completo de todas las ramas
      - name: Instalar gitleaks 8.30.1 (misma versión que en local)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version
      - name: Revisar todo el historial
        # --log-opts="--all": todos los commits de todas las ramas, no solo los del evento.
        # --redact: si encuentra algo, el registro no muestra el valor del secreto.
        # Si hay hallazgos, gitleaks termina con error y la corrida queda en rojo.
        run: ./gitleaks git -v --redact --log-opts="--all"
