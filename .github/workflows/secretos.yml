# Busca secretos (claves de API, contraseñas, tokens) en todo el historial en cada push
# y pull request. Taller de credenciales, semana 4 (UNIANDES).
name: secretos
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # todo el historial, no solo el último commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # El repositorio es de una cuenta personal: no necesita GITLEAKS_LICENSE.
