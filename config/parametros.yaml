# Parámetros variables del cálculo. Se cambian aquí, nunca en el código ni en el prompt.
# verificado: false  -> confirmar contra el texto oficial antes de programar (Semana 2).

anio_vigencia: 2026

salario_basico_unificado:
  valor: 482.00
  fuente: "Acuerdo Ministerial MDT-2025-195 (15-dic-2025), vigente desde 1-ene-2026"
  verificado: true

decimo_tercero:            # Código del Trabajo, art. 111
  periodo_inicio: "01-12"  # 1 de diciembre del año anterior
  periodo_fin: "30-11"     # 30 de noviembre del año en curso
  divisor: 12              # doceava parte de lo percibido
  fecha_maxima_pago: "24-12"
  verificado: false

decimo_cuarto:             # Código del Trabajo, art. 113
  valor_anual: "1 SBU"
  regiones:
    costa_galapagos:
      periodo: "1 de marzo al último día de febrero"
      fecha_maxima_pago: "15-03"
    sierra_amazonia:
      periodo: "1 de agosto al 31 de julio"
      fecha_maxima_pago: "15-08"
  verificado: false

horas:                     # Código del Trabajo, art. 55
  divisor_hora_ordinaria: 240   # remuneración mensual / 240 horas
  recargo_suplementaria: 0.50
  recargo_extraordinaria: 1.00
  verificado: false

vacaciones:                # Código del Trabajo, arts. 69 y 71
  dias_base: 15
  dia_adicional_desde_anio: 6   # un día adicional por cada año excedente de 5
  max_dias_adicionales: 15
  verificado: false

liquidacion:
  desahucio_porcentaje_por_anio: 0.25   # art. 185
  despido_minimo_remuneraciones: 3      # art. 188, hasta 3 años de servicio
  despido_tope_remuneraciones: 25       # art. 188
  verificado: false
